<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Chat Widget Zoom Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .test-iframe-container {
            width: 350px;
            height: 500px;
            border: 1px solid #ccc;
            overflow: hidden;
            margin: 20px auto;
            position: relative;
        }
        .test-iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform-origin: top left;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .zoom-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="range"] {
            width: 300px;
        }
        button {
            padding: 8px 16px;
            background-color: #45d3d3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #3bb9b9;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>n8n Chat Widget Zoom Test</h1>
        
        <div class="controls">
            <h2>Test Controls</h2>
            <div class="zoom-control">
                <label for="zoom-slider">Zoom Level:</label>
                <input type="range" id="zoom-slider" min="50" max="150" step="5" value="100">
                <input type="number" id="zoom-value" min="50" max="150" step="5" value="100" style="width: 60px;">
                <span>%</span>
            </div>
            <button id="apply-zoom">Apply Zoom</button>
        </div>
        
        <div class="test-iframe-container">
            <iframe src="https://example.com" class="test-iframe" id="test-iframe"></iframe>
        </div>
        
        <div class="result">
            <h3>Current Transform:</h3>
            <pre id="transform-result">transform: scale(1); width: 100%; height: 100%;</pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const zoomSlider = document.getElementById('zoom-slider');
            const zoomValue = document.getElementById('zoom-value');
            const applyZoomBtn = document.getElementById('apply-zoom');
            const iframe = document.getElementById('test-iframe');
            const transformResult = document.getElementById('transform-result');
            
            // Sync slider and number input
            zoomSlider.addEventListener('input', function() {
                zoomValue.value = this.value;
            });
            
            zoomValue.addEventListener('input', function() {
                zoomSlider.value = this.value;
            });
            
            // Apply zoom function
            function applyZoom() {
                const scale = parseInt(zoomValue.value, 10) / 100;
                
                // Apply transform to iframe
                iframe.style.transform = `scale(${scale})`;
                iframe.style.width = `${100/scale}%`;
                iframe.style.height = `${100/scale}%`;
                
                // Update result display
                transformResult.textContent = `transform: scale(${scale}); width: ${100/scale}%; height: ${100/scale}%;`;
            }
            
            // Apply zoom on button click
            applyZoomBtn.addEventListener('click', applyZoom);
            
            // Initial application
            applyZoom();
        });
    </script>
</body>
</html>
